name: CI Suíte Henke

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  validate:
    name: Validação de Integridade, Portões & Canários
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.11", "3.12"]

    steps:
      - name: Checkout do Repositório
        uses: actions/checkout@v4

      - name: Configurar Git para Testes
        run: |
          git config --global user.name "CI Bot"
          git config --global user.email "ci@henke.local"

      - name: Configurar Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Instalar Dependências
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Executar Validador Estrito da Suíte
        run: python scripts/validate_skills.py

      - name: Testar Validador contra Adulterações (Astra Canaries)
        run: python tests/test_validator.py

      - name: Testar Instalador, Transações Atômicas & Rollback
        run: python tests/test_install.py

      - name: Testar Portão de Custódia (Git Baseline & Scope)
        run: python tests/test_gate.py

      - name: Testar Spec Drift & Audit Ledger
        run: python tests/test_evals.py

      - name: Executar Bateria de Canários Adversariais (Evals)
        run: python evals/canaries.py

      - name: Testar Portões Métricos Assimilados
        run: python tests/test_metric_gates.py

      - name: Executar os 70 Canários Bilaterais dos Portões Métricos (M1-M70)
        run: python evals/canaries_metricas.py

      - name: Executar Benchmark Adversarial Completo (17 Defeitos + 3 Controles)
        run: python evals/bench_corpus.py --suite-dir .

      - name: Executar Canários Wave 7 (supervisão, TIA, manifests, watch, higiene)
        run: python evals/canaries_wave7.py

      - name: Executar Suíte Completa de Testes via unittest discover (inclui Wave 7)
        run: python -m unittest discover -s tests -p "test_*.py"

      - name: Executar Benchmark Wave 7 (paralelo x sequencial, incremental x full)
        run: python evals/bench_wave7.py

      - name: Executar Dogfooding do Hazard Scan (. no próprio repositório)
        run: python scripts/metricas/hazard_scan.py .

      - name: Testar Dry-Run do Instalador (Linux/macOS)
        if: runner.os == 'Linux'
        run: bash install.sh --dry-run

      - name: Testar Dry-Run do Instalador (Windows)
        if: runner.os == 'Windows'
        run: powershell -NoProfile -ExecutionPolicy Bypass -File install.ps1 -DryRun
