name: CI Suíte Henke

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  validate:
    name: Validação de Integridade, Portões & Canários
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        # P1-05/P2: 3.10 é o requires-python mínimo — sem matrix ele quebrava
        # em silêncio (sintaxe/builtins 3.11+ passavam no CI e falhavam no
        # usuário). Cache pip: a instalação de deps era o passo mais lento.
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - name: Checkout do Repositório
        uses: actions/checkout@v4

      - name: Configurar Git para Testes
        run: |
          git config --global user.name "CI Bot"
          git config --global user.email "ci@henke.local"

      - name: Configurar Python ${{ matrix.python-version }} (cache pip)
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Instalar Dependências
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Executar Validador Estrito da Suíte
        run: python henke/validate_skills.py

      - name: Provar regressões da banca 2 (Linux/Windows)
        run: python -m unittest tests.test_adversarial_round2 -v

      - name: Executar Bateria Completa de Testes Unitários (sob coverage)
        shell: bash
        run: |
          # banca-v18 (rev C-2): --include só FILTRA — módulo henke/* nunca
          # importado sumia do denominador (portão cego a 0% real). --source
          # ativa o scan da árvore e conta arquivos não-tocados.
          # Efeito colateral honesto: módulos exercitados só VIA SUBPROCESSO
          # (validate_skills, fence_check, ratchet, crap_score, tornado_scan)
          # mediriam 0% falso. Solução: coverage de subprocesso — .pth em
          # site-packages chama process_startup() quando COVERAGE_PROCESS_START
          # está setada; data_file absoluto em temp (subprocesso pode ter cwd
          # diferente) e parallel=true gera um arquivo por processo.
          COVDIR=$(python -c "import tempfile; print(tempfile.mkdtemp())")
          COVRC="$COVDIR/henke.coveragerc"
          COVDATA="$COVDIR/henke_cov"
          REPO_H=$(python -c "import os; print(os.path.abspath('henke'))")
          PURELIB=$(python -c "import sysconfig; print(sysconfig.get_paths()['purelib'])")
          printf 'import os; os.getenv("COVERAGE_PROCESS_START") and __import__("coverage").process_startup()\n' > "$PURELIB/zz_henke_subprocess_cov.pth"
          # Testes rodam copias temporarias de henke/ — [paths] mapeia qualquer
          # */henke para o modulo canonico do repo (mesma copia, mesma cobertura).
          # ignore_errors: copias em temp ja deletadas no report nao quebram o passo.
          printf '[run]\nsource = henke\nparallel = true\ndata_file = %s\n\n[paths]\nsource = %s */henke *\\henke\n\n[report]\nignore_errors = true\n' "$COVDATA" "$REPO_H" > "$COVRC"
          export COVERAGE_PROCESS_START="$COVRC"
          python -m coverage run --rcfile="$COVRC" -m unittest discover -s tests -p "test_*.py"
          python -m coverage combine --rcfile="$COVRC"
          # BANCA-C5: --fail-under transforma medição em portão (era cosmético);
          # 60% = ratchet honesto do baseline medido (~63%), sobe conforme
          # cobertura cresce.
          python -m coverage report --rcfile="$COVRC" -m --skip-empty --fail-under=60

      - name: Executar Bateria de Canários Adversariais (Evals)
        run: python evals/canaries.py

      - name: Executar os 84 Canários Bilaterais dos Portões Métricos (M1-M84)
        run: python evals/canaries_metricas.py

      - name: Executar Benchmark Adversarial Completo — modo estrito (MISSED/ERROR/FALSE-RED reprova)
        run: python evals/bench_corpus.py --suite-dir . --strict

      - name: Executar Canários Wave 7 (supervisão, TIA, manifests, watch, higiene)
        run: python evals/canaries_wave7.py

      - name: Executar Benchmark Wave 7 (paralelo x sequencial, incremental x full)
        run: python evals/bench_wave7.py

      - name: Executar Dogfooding do Hazard Scan (. no próprio repositório)
        run: python henke/metricas/hazard_scan.py .

      - name: Executar Dogfooding do Assertless Scan (tests/ da própria suíte)
        run: python henke/metricas/assertless_scan.py tests

      - name: Testar Dry-Run do Instalador (Linux/macOS)
        if: runner.os == 'Linux'
        run: bash install.sh --dry-run

      - name: Testar Dry-Run do Instalador (Windows)
        if: runner.os == 'Windows'
        run: powershell -NoProfile -ExecutionPolicy Bypass -File install.ps1 -DryRun

  packaging:
    # P1-05: antes nada provava que o pyproject gera um artefato instalável —
    # o wheel podia nascer quebrado (sem skills/data-files) e o CI ficava
    # verde. Agora: build → venv → doctor → portão → --target → --user.
    name: Prova de Empacotamento — wheel installável + doctor + portão
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout do Repositório
        uses: actions/checkout@v4

      - name: Configurar Python 3.11 (cache pip)
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Instalar build
        run: python -m pip install --upgrade pip build

      - name: Construir wheel
        run: python -m build --wheel --outdir dist/

      - name: Instalar wheel em venv limpo + doctor no artefato
        run: |
          python -m venv /tmp/henke_venv
          /tmp/henke_venv/bin/pip install --quiet dist/*.whl
          mkdir -p /tmp/probe_repo
          /tmp/henke_venv/bin/henke doctor --repo /tmp/probe_repo

      - name: Executar portão e henke check a partir do pacote instalado
        run: |
          printf 'x = 1\n' > /tmp/probe_repo/clean.py
          /tmp/henke_venv/bin/python -m henke.metricas.hazard_scan /tmp/probe_repo
          /tmp/henke_venv/bin/henke check --repo /tmp/probe_repo --no-cache

      - name: Instalar com --target e provar import do pacote
        run: |
          python -m pip install --quiet --target /tmp/henke_target dist/*.whl
          PYTHONPATH=/tmp/henke_target python -c "import henke.henke_cli; print('target import ok')"

      - name: Instalação de usuário (--user) + doctor + check
        run: |
          python -m pip install --quiet --user dist/*.whl
          "$HOME/.local/bin/henke" doctor --repo /tmp/probe_repo
          "$HOME/.local/bin/henke" check --repo /tmp/probe_repo --no-cache
