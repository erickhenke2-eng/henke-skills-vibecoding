[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "henke-skills"
version = "4.0.0"
description = "Suíte Henke v4.0 — 58 Macro-Skills, Portões Mecânicos Determinísticos e CLI Global henke"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "PyYAML>=6.0.2",
]

[project.scripts]
henke = "scripts.henke_cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["scripts*"]

# Artefatos runtime instalados junto ao pacote: sem eles o wheel vinha só com
# scripts*/ e `henke doctor`/`install_skills.py` operavam com 0 skills.
# Tudo aterrissa em <sys.prefix>/henke_data/ — resolvido via scripts/_paths.py
# (sysconfig data dir) como fallback do checkout.
[tool.setuptools.data-files]
henke_data = ["PROTOCOLO.md", "LICENSE", "AGENTS.md"]
"henke_data/docs/designs" = ["docs/designs/TEMPLATE.md"]
"henke_data/bin" = ["bin/henke", "bin/henke.cmd"]
"henke_data/henke-arch-banco" = ["henke-arch-banco/SKILL.md"]
